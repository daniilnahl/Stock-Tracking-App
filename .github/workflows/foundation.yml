name: Foundation

on:
  pull_request:
  push:
    branches: [main]

# All unspecified token permissions are disabled, including on fork PRs.
permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Tests (Python 3.11)
            python: '3.11'
            command: python -m pytest
          - check: Tests (Python 3.12)
            python: '3.12'
            command: python -m pytest
          - check: Ruff
            python: '3.11'
            command: python -m ruff check .
          - check: Mypy (configuration)
            python: '3.11'
            command: python -m mypy
          - check: Credential patterns
            python: '3.11'
            command: python -m pytest tests/test_repository_hygiene.py --tb=short
    env:
      # No provider secrets are provisioned or read by this workflow.
      FMP_API_KEY: ''
      MY_API_KEY: ''
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development environment
        run: python -m pip install ".[dev]"
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run check
        run: ${{ matrix.command }}
